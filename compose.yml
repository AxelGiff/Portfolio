services:
  dev:
    build:
      context: .
      dockerfile: .infrastructure/docker/Dockerfile
      target: dev
    container_name: portfolio-dev
    ports:
      - "${APP_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .infrastructure/env/.env
        required: false
    environment:
      - CHOKIDAR_USEPOLLING=true

  prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: .infrastructure/docker/Dockerfile
      target: prod
    container_name: portfolio-prod
    ports:
      - "${PROD_PORT:-8080}:80"
    restart: unless-stopped
